name: verify-smux

on:
  workflow_dispatch:
    inputs:
      without_fix:
        description: Restore the unfixed parser first to prove the test fails
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.20', '1.26']
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Restore the unfixed parser
        if: inputs.without_fix
        run: |
          git fetch --depth=1 https://github.com/MetaCubeX/mihomo.git c7af25c3a5b4dba2e03b0e0b6b0a3c1e0f27d5b1 2>/dev/null || git fetch --depth=1 https://github.com/MetaCubeX/mihomo.git Alpha
          git show FETCH_HEAD:adapter/parser.go > adapter/parser.go
          if grep -q '_ = proxy.Close()' adapter/parser.go; then echo 'unfixed parser unexpectedly contains the fix'; exit 1; fi
      - name: Smux regression test
        run: go test -run TestParseProxyClosesOutboundOnSmuxError -count=1 -v ./adapter/
      - name: Adapter and DNS packages
        if: '!inputs.without_fix'
        run: go test -count=1 ./adapter/ ./dns/
