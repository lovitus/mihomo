<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tsnet status</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --soft: #f3f4f6;
      --accent: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1240px, calc(100% - 24px));
      margin: 0 auto;
      padding: 14px 0 24px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 20px; line-height: 1.2; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    button, input {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      font: inherit;
      background: var(--panel);
      color: var(--text);
    }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--text); color: #fff; border-color: var(--text); }
    button:hover, input:focus { background: var(--soft); outline: none; }
    button.primary:hover { background: #111827; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .error { color: var(--danger); font-weight: 600; }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .toolbar input { min-width: 220px; }
    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: #fbfbfc;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .summary .section { margin-bottom: 0; }
    .body { padding: 8px 12px; }
    .kv {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 10px;
      padding: 4px 0;
    }
    .kv strong { color: var(--muted); font-weight: 500; }
    .kv span { overflow-wrap: anywhere; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #dcfce7;
      color: #15803d;
      font-weight: 700;
      font-size: 12px;
    }
    .pill.bad { background: #fee2e2; color: var(--danger); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; background: #fbfbfc; }
    td.wrap { white-space: normal; min-width: 220px; }
    tr:last-child td { border-bottom: 0; }
    .state-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
    }
    .state-dot.off { background: #9ca3af; }
    .logs {
      margin: 0;
      padding: 0;
      list-style: none;
      max-height: 280px;
      overflow: auto;
    }
    .logs li {
      display: grid;
      grid-template-columns: 180px 140px minmax(0, 1fr);
      gap: 10px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
    }
    .logs li:last-child { border-bottom: 0; }
    .logs strong { font-weight: 600; }
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .login {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
    }
    .login form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }
    .login input { width: 100%; min-width: 0; }
    @media (max-width: 820px) {
      main { width: min(100% - 16px, 1240px); padding-top: 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .toolbar { width: 100%; justify-content: flex-start; }
      .toolbar input { width: 100%; min-width: 0; }
      .summary { grid-template-columns: 1fr; }
      .logs li { grid-template-columns: 1fr; gap: 2px; }
      .kv { grid-template-columns: 88px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <section id="login" class="login-wrap hidden">
    <div class="login">
      <h1>tsnet status</h1>
      <p class="muted">Enter the controller secret to read protected Tailscale status APIs.</p>
      <form id="login-form">
        <input id="token" type="password" autocomplete="current-password" placeholder="Controller secret">
        <button type="submit" class="primary">Unlock</button>
      </form>
      <p id="login-error" class="error hidden">Authentication failed.</p>
    </div>
  </section>

  <main id="app" class="hidden">
    <header class="topbar">
      <div>
        <h1>tsnet status</h1>
        <p id="subtitle" class="muted">Read-only runtime view.</p>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Filter peers">
        <button id="refresh" type="button" class="primary">Refresh</button>
        <button id="auto" type="button">Auto: off</button>
        <button id="logout" type="button">Lock page</button>
      </div>
    </header>

    <div class="summary">
      <section class="section" id="runtime">
        <div class="section-head">
          <h2>Runtime</h2>
          <span id="state" class="pill">loading</span>
        </div>
        <div id="runtime-body" class="body"></div>
        <p id="status-error" class="error hidden body"></p>
      </section>
      <section class="section">
        <div class="section-head"><h2>Services</h2></div>
        <div id="services" class="body"></div>
      </section>
      <section class="section" id="tailnet">
        <div class="section-head"><h2>Tailnet</h2></div>
        <div id="tailnet-body" class="body"></div>
      </section>
    </div>

    <section class="section">
      <div class="section-head">
        <h2 id="peer-title">Peers</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>DNS</th>
              <th>IPs</th>
              <th>Allowed IPs</th>
              <th>Routes</th>
              <th>OS</th>
              <th>State</th>
              <th>Rx/Tx</th>
              <th>Last Seen</th>
              <th>Handshake</th>
            </tr>
          </thead>
          <tbody id="peers"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 id="log-title">Logs</h2>
      </div>
      <ul id="logs" class="logs"></ul>
    </section>
  </main>

  <script>
    const tokenKey = 'mihomo-controller-token';
    const state = { status: null, logs: [], auto: null };
    const $ = (id) => document.getElementById(id);
    const token = () => sessionStorage.getItem(tokenKey) || '';
    const headers = () => token() ? { Authorization: `Bearer ${token()}` } : {};

    async function api(path) {
      const res = await fetch(path, { headers: headers(), cache: 'no-store' });
      if (res.status === 401) throw new Error('unauthorized');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function showLogin(failed = false) {
      $('login').classList.remove('hidden');
      $('app').classList.add('hidden');
      $('login-error').classList.toggle('hidden', !failed);
    }

    function showApp() {
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
    }

    async function load() {
      try {
        const [status, logs] = await Promise.all([api('/tailscale'), api('/tailscale/logs')]);
        state.status = status;
        state.logs = logs.logs || [];
        showApp();
        render();
      } catch (err) {
        if (err.message === 'unauthorized') showLogin(true);
        else {
          showApp();
          $('status-error').textContent = err.message;
          $('status-error').classList.remove('hidden');
        }
      }
    }

    function kv(label, value) {
      return `<div class="kv"><strong>${escapeHtml(label)}</strong><span>${escapeHtml(value || '-')}</span></div>`;
    }

    function render() {
      const s = state.status || {};
      const peers = s.peers || [];
      $('subtitle').textContent = s.nodeName ? `${s.nodeName} · ${new Date().toLocaleTimeString()}` : 'Read-only runtime view.';
      $('peer-title').textContent = `Peers (${peers.length})`;
      $('log-title').textContent = `Logs (${state.logs.length})`;
      $('state').textContent = s.ready ? 'ready' : (s.state || 'not ready');
      $('state').classList.toggle('bad', !s.ready);
      $('status-error').textContent = s.statusError || '';
      $('status-error').classList.toggle('hidden', !s.statusError);
      const authLink = s['auth' + 'URL'];
      $('runtime-body').innerHTML = [
        kv('Enabled', String(Boolean(s.enable))),
        kv('State', s.state),
        kv('Node', s.nodeName),
        kv('Backend', s.backendState),
        kv('Tail IPs', (s.tailIPs || []).join(', ')),
        authLink ? '<div class="kv"><strong>Auth URL</strong><span><button id="copy-auth" type="button">Copy</button></span></div>' : ''
      ].join('');
      const copyAuth = $('copy-auth');
      if (copyAuth) copyAuth.addEventListener('click', () => copyText(authLink));
      const svc = s.services || {};
      $('services').innerHTML = [
        kv('Mesh', serviceText(svc.mesh)),
        kv('Gateway', serviceText(svc.gateway)),
        kv('Controller', serviceText(svc.controller))
      ].join('');
      const tailnet = s.tailnet || {};
      $('tailnet-body').innerHTML = [
        kv('Name', tailnet.name),
        kv('MagicDNS', tailnet.magicDNSSuffix),
        kv('Enabled', tailnet.magicDNSEnabled === undefined ? '-' : String(tailnet.magicDNSEnabled))
      ].join('');
      renderPeers();
      $('logs').innerHTML = state.logs.length ? state.logs.slice().reverse().map((log) =>
        `<li><span>${escapeHtml(formatTime(log.time))}</span><strong>${escapeHtml(log.event || log.level || 'log')}</strong><span>${escapeHtml(log.message || '')}</span></li>`
      ).join('') : '<li><span>No tsnet logs.</span></li>';
    }

    function renderPeers() {
      const q = $('search').value.trim().toLowerCase();
      const peers = (state.status && state.status.peers || []).filter((p) => {
        const haystack = [p.hostName, p.dnsName, p.os, ...(p.tailscaleIPs || []), ...(p.allowedIPs || []), ...(p.primaryRoutes || [])].join(' ').toLowerCase();
        return !q || haystack.includes(q);
      });
      $('peers').innerHTML = peers.length ? peers.map((p) => {
        const stateText = `${p.online ? 'online' : 'offline'}${p.active ? ' · active' : ''}${p.expired ? ' · expired' : ''}`;
        return `<tr>
          <td>${escapeHtml(p.hostName || p.publicKey || '-')}</td>
          <td class="wrap">${escapeHtml(p.dnsName || '-')}</td>
          <td class="wrap">${escapeHtml((p.tailscaleIPs || []).join(', ') || '-')}</td>
          <td class="wrap">${escapeHtml((p.allowedIPs || []).join(', ') || '-')}</td>
          <td class="wrap">${escapeHtml((p.primaryRoutes || []).join(', ') || '-')}</td>
          <td>${escapeHtml(p.os || '-')}</td>
          <td><span class="state-dot ${p.online ? '' : 'off'}"></span>${escapeHtml(stateText)}</td>
          <td>${formatBytes(p.rxBytes)} / ${formatBytes(p.txBytes)}</td>
          <td>${escapeHtml(formatTime(p.lastSeen))}</td>
          <td>${escapeHtml(formatTime(p.lastHandshake))}</td>
        </tr>`;
      }).join('') : '<tr><td colspan="10" class="muted">No peers.</td></tr>';
    }

    function serviceText(svc) {
      if (!svc) return '-';
      const flags = [];
      if (svc.enabled) flags.push('enabled');
      if (svc.ready || svc.tcpReady) flags.push('ready');
      if (svc.udpReady) flags.push('udp');
      if (svc.socks5Port) flags.push(`:${svc.socks5Port}`);
      if (svc.address) flags.push(svc.address);
      if (svc.activeConnections) flags.push(`${svc.activeConnections} conns`);
      if (svc.udpSessions) flags.push(`${svc.udpSessions} udp`);
      return flags.join(' · ') || 'disabled';
    }

    function formatBytes(value) {
      if (!value) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let n = Number(value);
      let i = 0;
      while (n >= 1024 && i < units.length - 1) {
        n /= 1024;
        i++;
      }
      return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
    }

    function formatTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    async function copyText(value) {
      await navigator.clipboard.writeText(value);
    }

    $('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      sessionStorage.setItem(tokenKey, $('token').value);
      load();
    });
    $('refresh').addEventListener('click', load);
    $('logout').addEventListener('click', () => {
      sessionStorage.removeItem(tokenKey);
      showLogin(false);
    });
    $('search').addEventListener('input', renderPeers);
    $('auto').addEventListener('click', () => {
      if (state.auto) {
        clearInterval(state.auto);
        state.auto = null;
        $('auto').textContent = 'Auto: off';
      } else {
        state.auto = setInterval(load, 5000);
        $('auto').textContent = 'Auto: 5s';
      }
    });
    load();
  </script>
</body>
</html>
